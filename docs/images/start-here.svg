<svg xmlns="http://www.w3.org/2000/svg" width="420" height="542" viewBox="0 0 420 542"
     role="img" aria-labelledby="onboarding-title onboarding-desc" lang="ja" xml:lang="ja">
  <title id="onboarding-title">はじめての端末登録</title>
  <desc id="onboarding-desc">Windowsで展開したフォルダーの Forge Remote E.cmd をダブルクリックします。PCに登録用のQRコードが表示されたら、スマホのカメラで読み取り、Forge Remote Eを開いて「このPCを登録」を押します。</desc>
  <rect width="420" height="542" rx="18" fill="#f5f8f6"/>
  <g font-family="'Yu Gothic UI','Noto Sans JP','Hiragino Sans',sans-serif" fill="#173b3b">
    <text x="22" y="43" font-size="27" font-weight="700">はじめての端末登録</text>

    <path d="M39 102 V408" fill="none" stroke="#80ada2" stroke-width="3" stroke-dasharray="4 5"/>
    <g>
      <circle cx="39" cy="93" r="17" fill="#1a6358"/>
      <text x="39" y="100" text-anchor="middle" font-size="19" font-weight="700" fill="white">1</text>
      <text x="70" y="100" font-size="20" font-weight="700">PCでダブルクリック</text>
      <text x="70" y="132" font-size="17">展開したフォルダーで開くファイル</text>
      <rect x="66" y="147" width="336" height="60" rx="9" fill="white" stroke="#8caba3"/>
      <g stroke="#23695e" stroke-width="2" stroke-linejoin="round">
        <path d="M82 161 H100 L107 168 V193 H82 Z" fill="#e0f3ec"/>
        <path d="M100 161 V169 H107" fill="none"/>
        <path d="m87 176 4 3-4 3 m7 2h6" fill="none" stroke-linecap="round"/>
      </g>
      <text x="118" y="185" font-family="Consolas,'Courier New',monospace" font-size="23" font-weight="700">Forge Remote E.cmd</text>
    </g>

    <g>
      <circle cx="39" cy="251" r="17" fill="#1a6358"/>
      <text x="39" y="258" text-anchor="middle" font-size="19" font-weight="700" fill="white">2</text>
      <text x="70" y="258" font-size="20" font-weight="700">PCにQRコードが表示される</text>
      <g stroke="#23695e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="70" y="280" width="79" height="52" rx="5" fill="#e0f3ec"/>
        <path d="M109.5 333 v6 m-15 0 h30" fill="none"/>
        <path d="M90 301 v-9 h9 m21 0 h9 v9 m0 10 v9 h-9 m-21 0 h-9 v-9" fill="none"/>
      </g>
      <text x="109.5" y="312" font-size="16" font-family="sans-serif" font-weight="700" text-anchor="middle">QR</text>
      <text x="162" y="307" font-size="17">登録カードを開いたまま</text>
      <text x="162" y="331" font-size="17">スマホを用意します。</text>
    </g>

    <g>
      <circle cx="39" cy="397" r="17" fill="#1a6358"/>
      <text x="39" y="404" text-anchor="middle" font-size="19" font-weight="700" fill="white">3</text>
      <text x="70" y="404" font-size="20" font-weight="700">スマホのカメラで読み取る</text>
      <text x="70" y="438" font-size="17">Forge Remote Eを開き、</text>
      <text x="70" y="463" font-size="17">確認画面で次のボタンを押します。</text>
      <rect x="70" y="478" width="210" height="46" rx="23" fill="#1a6358"/>
      <text x="175" y="508" text-anchor="middle" font-size="19" font-weight="700" fill="white">このPCを登録</text>
    </g>
  </g>
</svg>
