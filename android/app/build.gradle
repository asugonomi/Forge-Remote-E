plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

def releaseNotices = tasks.register("prepareNotices", Sync) {
    from(rootProject.file("../THIRD_PARTY_NOTICES.md"))
    from(rootProject.file("../third-party")) { into("third-party") }
    into(layout.buildDirectory.dir("generated/forgeNotices"))
}
android {
    namespace "jp.local.forgedesk"
    compileSdk 35
    buildToolsVersion "35.0.0"
    defaultConfig { applicationId "io.github.asugonomi.forgeremote.e"; minSdk 26; targetSdk 34; versionCode 1; versionName "1.0" }
    buildFeatures { compose true }
    sourceSets.main.assets.srcDir(layout.buildDirectory.dir("generated/forgeNotices"))
    composeOptions { kotlinCompilerExtensionVersion "1.5.14" }
    kotlinOptions { jvmTarget = "17" }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        localBuild {
            if (System.getenv("FORGE_KEYSTORE")) {
                storeFile file(System.getenv("FORGE_KEYSTORE"))
                keyAlias "forge"
                storePassword System.getenv("FORGE_SIGN_PASS")
                keyPassword System.getenv("FORGE_SIGN_PASS")
            }
        }
    }
    buildTypes { release { minifyEnabled false; if (System.getenv("FORGE_KEYSTORE")) signingConfig signingConfigs.localBuild } }
}
tasks.named("preBuild").configure { dependsOn(releaseNotices) }

dependencies {
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
    implementation platform("androidx.compose:compose-bom:2024.09.03")
    implementation "androidx.activity:activity-compose:1.9.3"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.foundation:foundation"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7"
    implementation "androidx.window:window:1.3.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
}
