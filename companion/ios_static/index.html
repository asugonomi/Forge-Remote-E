<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#141b1c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Forge Remote">
  <meta name="referrer" content="no-referrer">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/editor.css">
  <title>Forge Remote iOS</title>
</head>
<body>
  <header class="appbar">
    <div class="brand"><img src="/icons/icon-192.png" alt="" width="33" height="33"><b>Forge Remote</b><span>iOS</span></div>
    <button id="connection" class="connection" type="button"><i></i><span>接続を確認中</span></button>
  </header>
  <main id="setup" class="setup"><p>登録したPCに接続しています…</p></main>
  <main id="desk" class="desk" hidden>
    <div id="workspace" class="workspace"><section id="panel" aria-label="操作画面"></section></div>
    <aside id="preview" class="preview" aria-label="生成プレビュー">
      <div class="pane-heading"><h2>生成結果</h2><span id="result-state" class="quiet"></span></div>
      <div id="progress-area" hidden><div class="meter"><i id="meter-fill"></i></div><span id="progress-label"></span></div>
      <div id="result-stage"></div>
      <div id="suggestions-wide"></div>
    </aside>
  </main>
  <nav id="navigation" aria-label="操作メニュー" hidden></nav>
  <div id="notice" role="status" aria-live="polite" hidden></div>
  <noscript>Forge Remoteで生成や画像操作を行うにはSafariのJavaScriptを有効にしてください。</noscript>
  <script type="module" src="/app.js"></script>
</body>
</html>
